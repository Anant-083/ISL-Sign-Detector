<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>ISL Sign Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="logo-dot"></div>
            <div>
                <h1>ISL Detector</h1>
                <p>Real-time fingerspelling recognition</p>
            </div>
        </header>

        <main>
            <div class="camera-card">
                <div class="video-box">
                    <video id="video" autoplay playsinline muted></video>
                    <div class="corner tl"></div>
                    <div class="corner tr"></div>
                    <div class="corner bl"></div>
                    <div class="corner br"></div>
                    <div id="camState" class="cam-state">Starting camera…</div>
                </div>
            </div>

            <div class="result-card">
                <span class="result-label">Detected Sign</span>
                <div id="prediction" class="result-value">–</div>
            </div>

            <button id="switchBtn" class="switch-btn">Switch Camera</button>
        </main>

        <footer>
            <p>ISL fingerspelling · MediaPipe + Random Forest</p>
        </footer>

        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const predictionEl = document.getElementById('prediction');
        const camState = document.getElementById('camState');
        const switchBtn = document.getElementById('switchBtn');

        canvas.width = 480;
        canvas.height = 360;

        let currentFacing = 'user';
        let stream = null;

        async function startCamera(facingMode) {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode }
                });
                video.srcObject = stream;
                camState.style.display = 'none';
            } catch (err) {
                camState.innerText = "Camera access denied";
                camState.style.display = 'block';
                console.error(err);
            }
        }

        switchBtn.addEventListener('click', () => {
            currentFacing = currentFacing === 'user' ? 'environment' : 'user';
            startCamera(currentFacing);
        });

        startCamera(currentFacing);

        function sendFrame() {
            if (!video.videoWidth) return;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg', 0.6);

            fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData })
            })
            .then(res => res.json())
            .then(data => {
                predictionEl.innerText = data.prediction || "–";
            })
            .catch(() => {});
        }

        setInterval(sendFrame, 1000);
    </script>
</body>
</html>
