<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISL Sign Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="logo-dot"></div>
            <div>
                <h1>ISL Detector</h1>
                <p>Real-time fingerspelling recognition</p>
            </div>
        </header>

        <main>
            <div class="camera-card">
                <div class="video-box">
                    <video id="video" autoplay playsinline muted></video>
                    <canvas id="overlay"></canvas>
                    <div class="corner tl"></div>
                    <div class="corner tr"></div>
                    <div class="corner bl"></div>
                    <div class="corner br"></div>
                    <div id="camState" class="cam-state" style="display:none;">Camera access denied</div>
                </div>
            </div>

            <div class="result-card">
                <span class="result-label">Detected Sign</span>
                <div id="prediction" class="result-value">–</div>
            </div>
        </main>

        <footer>
            <p>ISL fingerspelling · MediaPipe + Random Forest</p>
        </footer>
    </div>

    <script type="module">
        import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const ctx = overlay.getContext('2d');
        const predictionEl = document.getElementById('prediction');
        const camState = document.getElementById('camState');

        let handLandmarker;
        let lastSendTime = 0;
        const SEND_INTERVAL = 600; // ms between backend calls

        async function init() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
            );
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
                },
                runningMode: "VIDEO",
                numHands: 1
            });

            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    video.addEventListener('loadeddata', () => {
                        overlay.width = video.videoWidth;
                        overlay.height = video.videoHeight;
                        predictLoop();
                    });
                })
                .catch(err => {
                    camState.style.display = 'flex';
                    console.error(err);
                });
        }

        function predictLoop() {
            if (video.readyState >= 2) {
                const result = handLandmarker.detectForVideo(video, performance.now());
                ctx.clearRect(0, 0, overlay.width, overlay.height);

                if (result.landmarks && result.landmarks.length > 0) {
                    const landmarks = result.landmarks[0];

                    // draw dots for visual feedback
                    ctx.fillStyle = "#2cb67d";
                    for (const lm of landmarks) {
                        ctx.beginPath();
                        ctx.arc(lm.x * overlay.width, lm.y * overlay.height, 3, 0, 2 * Math.PI);
                        ctx.fill();
                    }

                    const now = performance.now();
                    if (now - lastSendTime > SEND_INTERVAL) {
                        lastSendTime = now;
                        const coords = [];
                        for (const lm of landmarks) {
                            coords.push(lm.x, lm.y, lm.z);
                        }
                        sendLandmarks(coords);
                    }
                } else {
                    predictionEl.innerText = "–";
                }
            }
            requestAnimationFrame(predictLoop);
        }

        function sendLandmarks(coords) {
            fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ landmarks: coords })
            })
            .then(res => res.json())
            .then(data => {
                predictionEl.innerText = data.prediction || "–";
            })
            .catch(() => {});
        }

        init();
    </script>
</body>
</html>
