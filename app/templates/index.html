<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISL Sign Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="logo-dot"></div>
            <div><h1>ISL Detector</h1><p>Real-time fingerspelling recognition</p></div>
        </header>
        <main>
            <div class="camera-card">
                <div class="video-box">
                    <video id="video" autoplay playsinline muted></video>
                    <canvas id="overlay"></canvas>
                    <div id="camState" class="cam-state" style="display:none;">Camera access denied — check browser/site permissions</div>
                </div>
            </div>
            <div class="result-card">
                <span class="result-label">Current Letter</span>
                <div id="prediction" class="result-value">–</div>
                <div id="confidence" class="confidence-value"></div>
            </div>
            <div class="sentence-card">
                <span class="result-label">Sentence</span>
                <div id="sentence" class="sentence-value">&nbsp;</div>
                <div class="btn-row">
                    <button id="spaceBtn" class="ctrl-btn">Space</button>
                    <button id="backspaceBtn" class="ctrl-btn">Backspace</button>
                    <button id="clearBtn" class="ctrl-btn danger">Clear</button>
                </div>
            </div>
        </main>
        <footer><p>ISL fingerspelling · MediaPipe (browser) + Random Forest</p></footer>
    </div>

    <script type="module">
        import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const ctx = overlay.getContext('2d');
        const predictionEl = document.getElementById('prediction');
        const confidenceEl = document.getElementById('confidence');
        const sentenceEl = document.getElementById('sentence');
        const camState = document.getElementById('camState');

        let handLandmarker;
        let lastSendTime = 0;
        const SEND_INTERVAL = 500;
        const CONFIDENCE_THRESHOLD = 0.5;

        let history = [];
        const HISTORY_SIZE = 8;
        const MAJORITY_RATIO = 0.6;
        let lastConfirmed = null;
        let sentence = "";
        let noHandFrames = 0;

        function updateSentenceDisplay() {
            sentenceEl.textContent = sentence.length ? sentence : "\u00A0";
        }

        function confirmLetter(label) {
            history.push(label);
            if (history.length > HISTORY_SIZE) history.shift();
            if (history.length < HISTORY_SIZE) return;
            const counts = {};
            for (const h of history) counts[h] = (counts[h] || 0) + 1;
            let best = null, bestCount = 0;
            for (const k in counts) if (counts[k] > bestCount) { best = k; bestCount = counts[k]; }
            if (bestCount / HISTORY_SIZE >= MAJORITY_RATIO && best !== lastConfirmed) {
                lastConfirmed = best;
                sentence += best;
                updateSentenceDisplay();
            }
        }

        async function init() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
            );
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" },
                runningMode: "VIDEO",
                numHands: 1
            });

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" }
                });
                video.srcObject = stream;
                video.addEventListener('loadeddata', () => {
                    overlay.width = video.videoWidth;
                    overlay.height = video.videoHeight;
                    predictLoop();
                });
            } catch (err) {
                camState.style.display = 'flex';
                console.error(err);
            }
        }

        function predictLoop() {
            if (video.readyState >= 2) {
                const result = handLandmarker.detectForVideo(video, performance.now());
                ctx.clearRect(0, 0, overlay.width, overlay.height);

                if (result.landmarks && result.landmarks.length > 0) {
                    noHandFrames = 0;
                    const landmarks = result.landmarks[0];
                    ctx.fillStyle = "#2cb67d";
                    for (const lm of landmarks) {
                        ctx.beginPath();
                        ctx.arc(lm.x * overlay.width, lm.y * overlay.height, 3, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                    const now = performance.now();
                    if (now - lastSendTime > SEND_INTERVAL) {
                        lastSendTime = now;
                        const coords = [];
                        for (const lm of landmarks) coords.push(lm.x, lm.y, lm.z);
                        sendLandmarks(coords);
                    }
                } else {
                    predictionEl.innerText = "–";
                    confidenceEl.innerText = "";
                    noHandFrames++;
                    if (noHandFrames === 20) { history = []; lastConfirmed = null; }
                }
            }
            requestAnimationFrame(predictLoop);
        }

        function sendLandmarks(coords) {
            fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ landmarks: coords })
            })
            .then(res => res.json())
            .then(data => {
                const label = data.prediction || "";
                const conf = data.confidence || 0;
                predictionEl.innerText = label || "–";
                confidenceEl.innerText = label ? `${Math.round(conf * 100)}% confidence` : "";
                if (label && conf >= CONFIDENCE_THRESHOLD) confirmLetter(label);
            })
            .catch(() => {});
        }

        document.getElementById('spaceBtn').addEventListener('click', () => { sentence += " "; updateSentenceDisplay(); });
        document.getElementById('backspaceBtn').addEventListener('click', () => { sentence = sentence.slice(0, -1); updateSentenceDisplay(); });
        document.getElementById('clearBtn').addEventListener('click', () => { sentence = ""; updateSentenceDisplay(); });

        init();
    </script>
</body>
        </html>
